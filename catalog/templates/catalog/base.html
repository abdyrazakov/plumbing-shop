{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}СантехМаркет{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="{% url 'home' %}" class="site-title">
                <svg class="site-logo" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.47 2.47a1.5 1.5 0 0 1-2.12-2.12L14.7 6.3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
                СантехМаркет
            </a>
            <a href="tel:+996000000000" class="site-contact">+996 (000) 00-00-00</a>
        </div>
    </header>
    <main class="site-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        СантехМаркет — сантехника и материалы для дома. Заявки обрабатываются по телефону.
    </footer>
</body>
</html>
